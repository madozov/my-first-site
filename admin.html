<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Embroidery Requests</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    button { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-delete { background: #e63946; color: white; }
    .btn-login { background: #3ecf8e; color: white; width: 100%; padding: 10px; font-weight: bold; }
    form { display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .hidden { display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>Admin Portal 🔐</h1>

  <!-- Login Form -->
  <div id="loginSection">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Admin Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="btn-login">Sign In</button>
    </form>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboardSection" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Manage Requests</h2>
      <button id="logoutBtn">Logout</button>
    </div>
    <div id="adminRequestsList">Loading requests...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rnygezanwpfjnepskryu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJueWdlemFud3Bmam5lcHNrcnl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMzg5MzIsImV4cCI6MjEwNzYxNDkzMn0.RU4ET-Fl1KDstgCn7Oj3XlZFQW66npQr1Tl87fad0n4';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. Check Auth Status on Load
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showDashboard();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      loadAdminRequests();
    }

    // 2. Handle Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Login failed: ' + error.message);
      } else {
        showDashboard();
      }
    });

    // 3. Handle Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      showLogin();
    });

    // 4. Fetch Requests with Delete Option
    async function loadAdminRequests() {
      const listContainer = document.getElementById('adminRequestsList');
      const { data, error } = await supabaseClient
        .from('requests')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) {
        listContainer.innerHTML = '<p>Error loading requests.</p>';
        return;
      }

      if (data.length === 0) {
        listContainer.innerHTML = '<p>No requests to display.</p>';
        return;
      }

      listContainer.innerHTML = data.map(req => `
        <div class="card">
          <div>
            <strong>${req.name}</strong>
            <p style="margin: 4px 0;">${req.request_details}</p>
            <small>${req.contact_info}</small>
          </div>
          <button class="btn-delete" onclick="deleteRequest('${req.id}')">Delete</button>
        </div>
      `).join('');
    }

    // 5. Delete Request Function
    async function deleteRequest(id) {
      if (!confirm('Are you sure you want to delete this request?')) return;

      const { error } = await supabaseClient
        .from('requests')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Could not delete: ' + error.message);
      } else {
        loadAdminRequests();
      }
    }

    checkAuth();
  </script>
</body>
</html>
