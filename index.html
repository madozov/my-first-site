<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Embroidery Requests</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    h1 { color: #333; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; background: #f9f9f9; padding: 20px; border-radius: 8px; }
    input, textarea, button { padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #3ecf8e; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background: #34b27b; }
    .request-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 12px; }
    .request-card h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
    .request-card p { margin: 0 0 5px 0; color: #555; }
    .request-card .contact { font-size: 0.85rem; color: #888; }
  </style>
  <!-- Load the Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>Custom Embroidery Request Board 🪡</h1>
  <p>Have an idea for a custom design? Submit your request below!</p>

  <!-- Request Submission Form -->
  <form id="requestForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <textarea id="request_details" placeholder="What design or pattern would you like?" rows="3" required></textarea>
    <input type="text" id="contact_info" placeholder="Contact Info (Email or Phone)" required>
    <button type="submit">Submit Request</button>
  </form>

  <h2>Recent Requests</h2>
  <div id="requestsList">Loading requests...</div>

  <footer style="margin-top: 50px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-size: 0.85rem; color: #888;">
    <p>© Custom Embroidery Requests • <a href="admin.html" style="color: #888; text-decoration: none;">Admin Login 🔐</a></p>
  </footer>
  
  <script>
    // 1. Initialize Supabase Connection
    const SUPABASE_URL = 'https://rnygezanwpfjnepskryu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJueWdlemFud3Bmam5lcHNrcnl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMzg5MzIsImV4cCI6MjEwNzYxNDkzMn0.RU4ET-Fl1KDstgCn7Oj3XlZFQW66npQr1Tl87fad0n4';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Fetch and display requests on page load
    async function loadRequests() {
      const listContainer = document.getElementById('requestsList');
      const { data, error } = await supabaseClient
        .from('requests')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) {
        listContainer.innerHTML = '<p>Error loading requests.</p>';
        return;
      }

      if (data.length === 0) {
        listContainer.innerHTML = '<p>No requests yet. Be the first!</p>';
        return;
      }

      listContainer.innerHTML = data.map(req => {
        // Assign colors based on status
        let statusBg = '#f1f5f9';
        let statusColor = '#475569';
        if (req.status === 'In Progress') { statusBg = '#fef3c7'; statusColor = '#92400e'; }
        if (req.status === 'Completed') { statusBg = '#dcfce7'; statusColor = '#166534'; }

        return `
          <div class="card" style="border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <strong>${req.name}</strong>
              <span style="background: ${statusBg}; color: ${statusColor}; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;">
                ${req.status || 'Pending'}
              </span>
            </div>
            <p style="margin: 6px 0;">${req.request_details}</p>
            <small style="color: #666;">${req.contact_info}</small>
          </div>
        `;
      }).join('');
    }

    // 3. Handle Form Submission
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const request_details = document.getElementById('request_details').value;
      const contact_info = document.getElementById('contact_info').value;

      // Insert row into Supabase 'requests' table
      const { error } = await supabaseClient
        .from('requests')
        .insert([{ name, request_details, contact_info }]);

      if (error) {
        alert('Error submitting request: ' + error.message);
      } else {
        // Clear form & reload requests
        document.getElementById('requestForm').reset();
        loadRequests();
      }
    });

    // Run on load
    loadRequests();
  </script>
</body>
</html>
